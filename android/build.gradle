buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

// Must run before subprojects are fully evaluated. Fixes NDK builds when the user
// profile path contains spaces (CMake uses CLANG_~1.EXE and drops libc++ linkage).
subprojects { subproject ->
    subproject.afterEvaluate {
        if (subproject.plugins.hasPlugin("com.android.application") ||
            subproject.plugins.hasPlugin("com.android.library")) {
            def cmake = subproject.android.defaultConfig.externalNativeBuild?.cmake
            if (cmake != null) {
                cmake.cppFlags("-canonical-prefixes")
            }
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
